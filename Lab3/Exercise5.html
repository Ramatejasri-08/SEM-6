<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workflow Engine | Multi-Stage Form</title>
    <style>
         :root {
            --primary: brown;
            --bg: lightblue;
            --card:lightblue;
            --text: green;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .form-container {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px olivedrab;
        }
        /* 3. Dynamic Progress Bar */
        
        .progress-track {
            height: 6px;
            background: #334155;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        #progress-fill {
            height: 100%;
            width: 25%;
            background: var(--primary);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 4. Show/Hide Stages */
        
        .stage {
            display: none;
        }
        
        .stage.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
        }
        
        h3 {
            margin-top: 0;
            color: var(--primary);
        }
        
        input {
            width: 100%;
            padding: 14px;
            background: lightyellow;
            border: 1px solid #334155;
            border-radius: 8px;
            color: olivedrab;
            margin: 15px 0 5px;
            box-sizing: border-box;
        }
        
        .error-label {
            color: #fb7185;
            font-size: 0.8rem;
            visibility: hidden;
            margin-bottom: 10px;
        }
        
        .btn-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-next {
            background: var(--primary);
            color: white;
        }
        
        .btn-back {
            background: transparent;
            color: #94a3b8;
        }
        
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <div class="progress-track">
            <div id="progress-fill"></div>
        </div>

        <form id="workflow">
            <div class="stage active" id="s1">
                <h3>01. Credentials</h3>
                <label>Username (Min 5 chars)</label>
                <input type="text" id="username" placeholder="johndoe123">
                <div class="error-label" id="err-1">Username too short</div>
            </div>

            <div class="stage" id="s2">
                <h3>02. Contact</h3>
                <label>Email Address</label>
                <input type="email" id="email" placeholder="john@example.com">
                <div class="error-label" id="err-2">Invalid email format</div>
            </div>

            <div class="stage" id="s3">
                <h3>03. Bio</h3>
                <label>Short Bio (Max 20 chars)</label>
                <input type="text" id="bio" placeholder="Tell us about you...">
                <div class="error-label" id="err-3">Bio too long! Keep it short.</div>
            </div>

            <div class="stage" id="s4">
                <h3>04. Finalize</h3>
                <p>Confirm your details below:</p>
                <div id="summary" style="background: #0f172a; padding: 15px; border-radius: 8px; font-size: 0.9rem;"></div>
            </div>

            <div class="btn-nav">
                <button type="button" class="btn-back" id="back" onclick="changeStage(-1)" disabled>Back</button>
                <button type="button" class="btn-next" id="next" onclick="changeStage(1)">Next Step</button>
            </div>
        </form>
    </div>

    <script>
        // 6. Store user input temporarily
        let currentStep = 1;
        const userData = {};

        function validate() {
            if (currentStep === 1) return document.getElementById('username').value.length >= 5;
            if (currentStep === 2) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value);
            if (currentStep === 3) return document.getElementById('bio').value.length <= 20;
            return true;
        }

        function changeStage(dir) {
            // 5. Prevent navigation if invalid
            const error = document.getElementById(`err-${currentStep}`);
            if (dir === 1 && !validate()) {
                if (error) error.style.visibility = 'visible';
                return;
            }
            if (error) error.style.visibility = 'hidden';

            // 2. Control Navigation
            document.getElementById(`s${currentStep}`).classList.remove('active');
            currentStep += dir;
            document.getElementById(`s${currentStep}`).classList.add('active');

            // 3. Dynamic Progress
            document.getElementById('progress-fill').style.width = (currentStep * 25) + '%';

            // Button Logic
            document.getElementById('back').disabled = (currentStep === 1);
            document.getElementById('next').textContent = (currentStep === 4) ? "Finish" : "Next Step";

            if (currentStep === 4) {
                document.getElementById('summary').innerHTML = `
                <b>User:</b> ${document.getElementById('username').value}<br>
                <b>Email:</b> ${document.getElementById('email').value}<br>
                <b>Bio:</b> ${document.getElementById('bio').value}
            `;
                document.getElementById('next').onclick = () => alert("Form Submitted Successfully!");
            } else {
                document.getElementById('next').onclick = () => changeStage(1);
            }
        }
    </script>

</body>

</html>
