<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedia Exercise</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        .media-group { margin-bottom: 40px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
        .time-display { font-weight: bold; color: #555; margin-top: 5px; }
        video { width: 100%; border-radius: 8px; background: #000; }
    </style>
</head>
<body>

    <div class="container">
        <div class="media-group">
            <h2>Audio Player</h2>
            <audio id="myAudio" controls>
                <source src="Audio.wav" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="time-display">Current Time: <span id="audioTime">0:00</span></div>
        </div>

        <div class="media-group">
            <h2>Video Player</h2>
            <video id="myVideo" height="360" width="420" controls>
                <source src="Myvideo.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
            <div class="time-display">Current Time: <span id="videoTime">0:00</span></div>
        </div>
    </div>

    <script>
        // Function to format seconds into M:SS
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // 1. Audio Time Tracking
        const audio = document.getElementById('myAudio');
        const audioDisplay = document.getElementById('audioTime');

        audio.addEventListener('timeupdate', () => {
            audioDisplay.innerText = formatTime(audio.currentTime);
        });

        // 2. Video Time Tracking
        const video = document.getElementById('myVideo');
        const videoDisplay = document.getElementById('videoTime');

        video.addEventListener('timeupdate', () => {
            videoDisplay.innerText = formatTime(video.currentTime);
        });
    </script>

</body>
</html>
