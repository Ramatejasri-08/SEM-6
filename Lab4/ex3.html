<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
        }
        .message {
            margin-top: 10px;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<h2>Student Management System</h2>

<form id="studentForm">
    Student ID: <input type="text" id="studentId" required><br><br>
    Name: <input type="text" id="studentName" required><br><br>
    Department: <input type="text" id="studentDept" required><br><br>
    Marks: <input type="number" id="studentMarks" required><br><br>
    <button type="submit">Save Student</button>
</form>

<div id="message" class="message"></div>

<h3>Student List</h3>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Marks</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentTable">
    </tbody>
</table>

<script>
let students = [];
let editIndex = -1;

const form = document.getElementById("studentForm");
const messageDiv = document.getElementById("message");
const tableBody = document.getElementById("studentTable");

// CREATE + UPDATE
form.addEventListener("submit", function(e) {
    e.preventDefault();

    const id = document.getElementById("studentId").value;
    const name = document.getElementById("studentName").value;
    const dept = document.getElementById("studentDept").value;
    const marks = document.getElementById("studentMarks").value;

    const studentData = { id, name, dept, marks };

    try {
        if (editIndex === -1) {
            // CREATE
            students.push(studentData);
            showMessage("Student added successfully (200 OK)", "success");
        } else {
            // UPDATE
            students[editIndex] = studentData;
            showMessage("Student updated successfully (200 OK)", "success");
            editIndex = -1;
        }

        renderTable();
        form.reset();
    } catch (error) {
        showMessage("Server Error (500)", "error");
    }
});

// READ
function renderTable() {
    tableBody.innerHTML = "";

    if (students.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5">No Records Found (404)</td></tr>`;
        return;
    }

    students.forEach((student, index) => {
        tableBody.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.dept}</td>
                <td>${student.marks}</td>
                <td>
                    <button onclick="editStudent(${index})">Edit</button>
                    <button onclick="deleteStudent(${index})">Delete</button>
                </td>
            </tr>
        `;
    });
}

// UPDATE (Load data into form)
function editStudent(index) {
    const student = students[index];

    document.getElementById("studentId").value = student.id;
    document.getElementById("studentName").value = student.name;
    document.getElementById("studentDept").value = student.dept;
    document.getElementById("studentMarks").value = student.marks;

    editIndex = index;
}

// DELETE
function deleteStudent(index) {
    try {
        students.splice(index, 1);
        renderTable();
        showMessage("Student deleted successfully (200 OK)", "success");
    } catch (error) {
        showMessage("Delete Failed (500)", "error");
    }
}

// MESSAGE DISPLAY
function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = "message " + type;

    setTimeout(() => {
        messageDiv.textContent = "";
    }, 3000);
}
</script>

</body>
</html>
